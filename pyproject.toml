[project]
name = "support-extraction-harness"
version = "0.1.0"
description = "Bounded, audited support transcript extraction"
requires-python = ">=3.12"
dependencies = [
  "langchain>=1.2,<2",
  "langchain-openai>=1,<2",
  "langgraph-checkpoint-sqlite>=3,<4",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "gradio>=6,<7",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "httpx>=0.28,<1", "ruff>=0.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
  "src/runtime",
  "src/middleware",
  "src/streaming",
  "src/support_extraction",
  "src/infrastructure",
  "src/entrypoints",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
